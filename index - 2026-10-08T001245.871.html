<style>
:root{
  --red:#D71920; --red-d:#A8121A; --red-50:#FDECEC; --ink:#1E2130; --ink-2:#3A3F52; --steel:#646B7E; --mute:#8A90A0;
  --line:#E2E4EA; --line-2:#EEF0F4; --paper:#F4F5F8; --card:#FFFFFF;
  --green:#0E8A5C; --green-50:#E6F5EE; --amber:#B4740A; --amber-50:#FDF3E1; --blue:#2C5AA8; --blue-50:#E9EFFA;
  --num:'Barlow Condensed','IBM Plex Sans Arabic',system-ui,sans-serif;
  --txt:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:10px; --rail:232px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--txt);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num,.tag .v,td.n,th.n{font-variant-numeric:tabular-nums}
/* ---------- login ---------- */
#login{min-height:100vh;display:grid;place-items:center;padding:24px;background:
  linear-gradient(180deg,#fff 0,#fff 58%,var(--paper) 58%)}
.login-card{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:14px;padding:32px 28px 26px;box-shadow:0 20px 50px -30px rgba(30,33,48,.35);position:relative;overflow:hidden}
.login-card:before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--red)}
.login-card img{height:92px;display:block;margin:0 auto 6px}
.login-card h1{font-size:20px;margin:6px 0 2px;text-align:center}
.login-card p.sub{margin:0 0 22px;text-align:center;color:var(--steel)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12.5px;color:var(--steel);font-weight:500}
.inp{height:42px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:#fff;width:100%}
.inp:focus{border-color:var(--ink-2);outline:none;box-shadow:0 0 0 3px var(--line-2)}
.btn{height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:#c9ccd5}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.pri:hover{background:var(--red-d)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent}
.btn svg{width:16px;height:16px;flex:none}
.login-card .btn.pri{width:100%;height:44px;justify-content:center;font-size:15px}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--steel);margin:4px 0 16px}
.err{color:var(--red-d);font-size:13px;min-height:20px;margin:4px 0}
.login-foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:12px;color:var(--mute)}
/* ---------- app shell ---------- */
#app{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100vh}
.rail{background:#fff;border-inline-end:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:16px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 14px;border-bottom:1px solid var(--line-2);margin-bottom:10px}
.brand img{width:44px;height:44px;object-fit:contain;border-radius:8px;border:1px solid var(--line-2)}
.brand b{display:block;font-size:15px}
.brand small{color:var(--steel);font-size:11.5px;line-height:1.3;display:block}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:start;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--ink-2);font-weight:500}
.nav button svg{width:18px;height:18px;flex:none;color:var(--mute)}
.nav button:hover{background:var(--paper)}
.nav button.on{background:var(--red-50);color:var(--red-d)}
.nav button.on svg{color:var(--red)}
.nav .sep{height:1px;background:var(--line-2);margin:8px 6px}
.rail-foot{border-top:1px solid var(--line-2);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.stamp{font-size:11.5px;color:var(--steel);line-height:1.45;padding:0 6px}
.stamp b{color:var(--ink);font-weight:600;display:block;font-size:12.5px}
.stamp .row{display:flex;justify-content:space-between;gap:6px}.stamp .row span:first-child{white-space:nowrap}.stamp .row span:last-child{text-align:end}
.rail-foot .acts{display:flex;gap:6px}
.rail-foot .acts .btn{flex:1;justify-content:center}
main{min-width:0}
.top{position:sticky;top:0;z-index:30;background:rgba(244,245,248,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 24px 10px}
.srch{position:relative;max-width:760px}
.srch input{height:44px;padding-inline:42px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;width:100%;font-size:14.5px}
.srch input:focus{outline:none;border-color:var(--ink-2);box-shadow:0 0 0 3px var(--line-2)}
.srch>svg{position:absolute;inset-inline-start:13px;top:13px;width:18px;height:18px;color:var(--mute)}
.sres{position:absolute;inset-inline:0;top:48px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 18px 40px -18px rgba(30,33,48,.35);max-height:70vh;overflow:auto;z-index:50;padding:6px}
.sres .grp{font-size:11.5px;color:var(--mute);padding:8px 10px 4px;font-weight:600}
.sres button{display:flex;width:100%;text-align:start;border:0;background:transparent;padding:8px 10px;border-radius:7px;cursor:pointer;gap:10px;align-items:center}
.sres button.act,.sres button:hover{background:var(--paper)}
.sres .ic{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;flex:none;font-size:11px;font-weight:700;color:#fff}
.sres .l{font-weight:500;line-height:1.25}
.sres .s{font-size:12px;color:var(--steel)}
.sres mark{background:#FFF1A8;color:inherit;border-radius:2px}
.sres .empty{padding:14px;color:var(--steel)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.sel{height:32px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:0 8px;font-size:13px;max-width:200px}
.flabel{font-size:12px;color:var(--steel)}
.chip{height:28px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:0 11px;font-size:12.5px;cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
#view{padding:22px 24px 60px;max-width:1500px}
.ph{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-size:24px;margin:0;line-height:1.2;letter-spacing:-.01em}
.ph p{margin:4px 0 0;color:var(--steel);max-width:720px}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
.crumb{font-size:12.5px;color:var(--steel);margin-bottom:6px}
.crumb a{cursor:pointer;color:var(--steel);text-decoration:none}
.crumb a:hover{color:var(--ink)}
.note{background:var(--blue-50);color:#20427c;border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:14px;display:flex;gap:8px;align-items:flex-start}
.note.warn{background:var(--amber-50);color:#7a4d03}
.note svg{width:16px;height:16px;flex:none;margin-top:2px}
/* ---------- price-tag KPIs ---------- */
.tags{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px;margin-bottom:18px}
.tag{position:relative;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px 12px 22px;min-height:104px;cursor:default}
[dir=rtl] .tag{padding:12px 22px 12px 14px}
.tag:before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:7px;border-start-start-radius:8px;border-end-start-radius:8px;background:var(--ink)}
.tag:after{content:"";position:absolute;inset-inline-start:13px;top:12px;width:5px;height:5px;border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line)}
.tag.red:before{background:var(--red)} .tag.green:before{background:var(--green)} .tag.amber:before{background:var(--amber)} .tag.blue:before{background:var(--blue)}
.tag.link{cursor:pointer} .tag.link:hover{border-color:#c9ccd5}
.tag .k{font-size:12.5px;color:var(--steel);font-weight:500;padding-inline-start:8px}
.tag .v{font-family:var(--num);font-weight:600;font-size:34px;line-height:1.1;letter-spacing:.005em;margin-top:4px;direction:ltr;text-align:start;unicode-bidi:plaintext}
.tag .v small{font-size:16px;color:var(--steel);font-weight:500;margin-inline-start:3px}
.tag .s{font-size:12px;color:var(--steel);margin-top:2px}
.up{color:var(--green)} .dn{color:var(--red-d)}
/* ---------- panels ---------- */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g32{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.pn{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.pn h3{margin:0 0 2px;font-size:15px}
.pn .hint{margin:0 0 12px;color:var(--steel);font-size:12.5px}
.pn-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.pn-h .acts{display:flex;gap:6px;flex-wrap:wrap}
.chart{position:relative;height:280px}
.chart.sm{height:220px} .chart.lg{height:340px}
section.blk{margin-top:14px}
/* ---------- tables ---------- */
.tw{overflow:auto;border:1px solid var(--line-2);border-radius:8px;max-height:560px}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.t th{position:sticky;top:0;background:#F8F9FB;text-align:start;font-weight:600;color:var(--ink-2);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;font-size:12.5px;z-index:1}
.t th.n,.t td.n{text-align:end}
.t th .ar{color:var(--mute);font-size:10px;margin-inline-start:3px}
.t td{padding:7px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.t tr:hover td{background:#FAFBFC}
.t tr.click{cursor:pointer}
.t tfoot td{position:sticky;bottom:0;background:#F8F9FB;font-weight:600;border-top:1px solid var(--line)}
.t td.wrap{white-space:normal;min-width:220px}
.t td a[data-go^="store"],.cd{white-space:nowrap}
.t td .mut{color:var(--mute);font-size:12px}
.tbar{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.tbar input{height:32px;border:1px solid var(--line);border-radius:7px;padding:0 10px;min-width:200px}
.more{display:flex;justify-content:center;padding:8px;color:var(--steel);font-size:12.5px;gap:10px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--green-50);color:var(--green)} .pill.oos{background:var(--red-50);color:var(--red-d)} .pill.partial,.pill.capped{background:var(--amber-50);color:var(--amber)} .pill.blocked{background:#EDEEF2;color:var(--ink-2)}
.pill.gap{background:var(--blue-50);color:var(--blue)} .pill.missed{background:var(--red-50);color:var(--red-d)} .pill.under{background:var(--amber-50);color:var(--amber)} .pill.listing{background:#F1ECFB;color:#5B3BB0} .pill.reactivate{background:#EDEEF2;color:var(--ink-2)} .pill.push{background:var(--green-50);color:var(--green)}
.pill.A{background:var(--ink);color:#fff} .pill.B{background:#C9CCD5;color:var(--ink)} .pill.C{background:#EDEEF2;color:var(--steel)}
.bar{height:6px;background:var(--line-2);border-radius:3px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--ink)}
.heat td.h{text-align:end;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:6px;vertical-align:middle}
/* ---------- talking points ---------- */
.tps{display:flex;flex-direction:column;gap:2px}
.tp{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:start;padding:10px 6px;border-bottom:1px solid var(--line-2)}
.tp:last-child{border-bottom:0}
.tp .ic{width:28px;height:28px;border-radius:7px;display:grid;place-items:center}
.tp .ic svg{width:16px;height:16px}
.tp .ic.red{background:var(--red-50);color:var(--red)} .tp .ic.green{background:var(--green-50);color:var(--green)} .tp .ic.amber{background:var(--amber-50);color:var(--amber)} .tp .ic.blue{background:var(--blue-50);color:var(--blue)}
.tp b{font-weight:600}
.tp p{margin:2px 0 0;color:var(--steel);font-size:13px}
.tp .go{align-self:center}
/* ---------- store/sku 360 ---------- */
.hero360{display:flex;gap:16px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px;flex-wrap:wrap}
.hero360 .badge{font-family:var(--num);font-size:34px;font-weight:700;min-width:84px;height:68px;padding:0 12px;border-radius:10px;background:var(--red);color:#fff;display:grid;place-items:center}
.hero360 h2{margin:0;font-size:20px}
.hero360 .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.hero360 .meta span{background:var(--paper);border-radius:6px;padding:2px 8px;font-size:12.5px;color:var(--ink-2)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:4px 0 14px;overflow:auto}
.tabs button{border:0;background:transparent;padding:9px 12px;cursor:pointer;color:var(--steel);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--red)}
/* ---------- story ---------- */
.deck{background:#fff;border:1px solid var(--line);border-radius:14px;aspect-ratio:16/9;position:relative;overflow:hidden;max-width:1200px}
.slide{position:absolute;inset:0;padding:4.2% 5%;display:flex;flex-direction:column}
.slide .sh{display:flex;align-items:center;justify-content:space-between;gap:16px}
.slide .sh img{height:clamp(40px,6vw,76px)}
.slide .kick{color:var(--red);font-weight:600;font-size:clamp(11px,1.2vw,15px)}
.slide h2{font-size:clamp(20px,2.9vw,38px);line-height:1.15;margin:.6em 0 .35em;max-width:80%;letter-spacing:-.01em}
.slide .lead{color:var(--steel);font-size:clamp(12px,1.35vw,17px);max-width:72%}
.slide .body{flex:1;display:grid;gap:3%;margin-top:2%;min-height:0}
.slide .big{font-family:var(--num);font-size:clamp(34px,6vw,84px);font-weight:700;line-height:1;color:var(--ink)}
.slide .big.red{color:var(--red)}
.slide .cap{color:var(--steel);font-size:clamp(11px,1.15vw,15px)}
.slide .foot{display:flex;justify-content:space-between;color:var(--mute);font-size:clamp(9px,.95vw,12px);border-top:1px solid var(--line-2);padding-top:1%}
.slide .strip{position:absolute;inset-block-end:0;inset-inline:0;height:6px;background:var(--red)}
.slide ul{margin:0;padding-inline-start:1.2em;font-size:clamp(12px,1.3vw,17px)}
.slide li{margin:.35em 0}
.slide .chart{height:100%}
.deckbar{display:flex;gap:8px;align-items:center;margin:12px 0}
.dots{display:flex;gap:5px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line);cursor:pointer}
.dots i.on{background:var(--red)}
/* ---------- admin ---------- */
.drop{display:block;border:2px dashed #C9CCD5;border-radius:12px;padding:26px;text-align:center;background:#fff;cursor:pointer}
.drop.over{border-color:var(--red);background:var(--red-50)}
.drop b{display:block;font-size:15px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv span:nth-child(odd){color:var(--steel)}
.mtx input{width:84px;height:30px;border:1px solid var(--line);border-radius:6px;padding:0 6px;text-align:end}
.mtx input::placeholder{color:#B6BAC5}
.form-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}
.form-row .field{margin:0}
.form-row .inp{height:36px}
/* ---------- misc ---------- */
#toast{position:fixed;inset-block-end:20px;inset-inline-start:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:9px;font-size:13.5px;z-index:99;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s}
[dir=rtl] #toast{transform:translateX(50%)}
#toast.on{opacity:1}
#busy{position:fixed;inset:0;background:rgba(244,245,248,.75);display:grid;place-items:center;z-index:98}
#busy div{background:#fff;border:1px solid var(--line);padding:16px 22px;border-radius:10px;display:flex;gap:12px;align-items:center;font-weight:500}
.spin{width:18px;height:18px;border:2.5px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.mob-nav{display:none}
@media (max-width:1100px){.g3{grid-template-columns:1fr 1fr}.g32{grid-template-columns:1fr}}
@media (max-width:860px){
  #app{grid-template-columns:1fr}
  .rail{display:none}
  .mob-nav{display:flex;position:fixed;inset-block-end:0;inset-inline:0;background:#fff;border-top:1px solid var(--line);z-index:40;overflow-x:auto;padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
  .mob-nav button{flex:1 0 auto;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;padding:6px 8px;color:var(--steel);border-radius:8px}
  .mob-nav button.on{color:var(--red-d);background:var(--red-50)}
  .mob-nav svg{width:19px;height:19px}
  .top{padding:10px 16px}
  #view{padding:16px 16px 90px}
  .g2,.g3{grid-template-columns:1fr}
  .tags{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tag .v{font-size:27px}
  .ph h1{font-size:20px}
  .mob-top{display:flex!important}
  .slide h2{max-width:100%}.slide .lead{max-width:100%}
}
.mob-top{display:none;align-items:center;justify-content:space-between;margin-bottom:8px}
.mob-top img{height:34px}
@media print{
  body{background:#fff}
  .rail,.top,.mob-nav,.deckbar,.ph .acts,#toast{display:none!important}
  #app{display:block} #view{padding:0;max-width:none}
  .print-deck .deck{page-break-after:always;border:0;border-radius:0;max-width:none;width:100%}
  @page{size:A4 landscape;margin:8mm}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
var TB = {};

/* ---- parse.js ---- */
/* ===================== PARSE: workbook sheets -> unified dataset ===================== */
/* Environment-agnostic (browser + node). Input: {sheetName: [[row],[row]...]} arrays-of-arrays. */

(function (TB) {
  'use strict';
  var CATS = ['Chocolate', 'Icecream', 'Cakes', 'Gum', 'Fruity Confections', 'KIND', 'Petcare', 'Tru Fru'];
  TB.CATS = CATS;
  var MONTHS = { jan: 1, january: 1, feb: 2, february: 2, mar: 3, march: 3, apr: 4, april: 4, may: 5, jun: 6, june: 6, jul: 7, july: 7, aug: 8, august: 8, sep: 9, sept: 9, september: 9, oct: 10, october: 10, nov: 11, november: 11, dec: 12, december: 12,
    'يناير': 1, 'فبراير': 2, 'مارس': 3, 'ابريل': 4, 'أبريل': 4, 'مايو': 5, 'يونيو': 6, 'يوليو': 7, 'اغسطس': 8, 'أغسطس': 8, 'سبتمبر': 9, 'اكتوبر': 10, 'أكتوبر': 10, 'نوفمبر': 11, 'ديسمبر': 12 };

  function key(s) { return String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9؀-ۿ#]+/g, ''); }
  TB.key = key;
  function hnorm(s) { return String(s == null ? '' : s).toLowerCase().replace(/\s+/g, ' ').trim(); }
  /* robust number parser (text numbers, comma decimals, arabic digits, currency) */
  function num(v) {
    if (v == null || v === '') return 0;
    if (typeof v === 'number') return isFinite(v) ? v : 0;
    if (typeof v === 'boolean') return v ? 1 : 0;
    if (v instanceof Date) return 0;
    var s = String(v).trim();
    s = s.replace(/[٠-٩]/g, function (d) { return d.charCodeAt(0) - 0x0660; })
      .replace(/[۰-۹]/g, function (d) { return d.charCodeAt(0) - 0x06F0; })
      .replace(/٫/g, '.').replace(/٬/g, ',');
    var neg = /^\(.*\)$/.test(s) || /^-/.test(s.replace(/[^\d\-(]/g, ''));
    s = s.replace(/[^\d.,]/g, '');
    if (!s) return 0;
    var lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
    if (lc > -1 && ld > -1) { if (lc > ld) s = s.replace(/\./g, '').replace(',', '.'); else s = s.replace(/,/g, ''); }
    else if (lc > -1) { var parts = s.split(','); if (parts.length === 2 && parts[1].length !== 3) s = parts.join('.'); else s = s.replace(/,/g, ''); }
    else if (ld > -1) { var p2 = s.split('.'); if (p2.length > 2) s = s.replace(/\./g, ''); }
    var n = parseFloat(s);
    if (!isFinite(n)) return 0;
    return neg ? -Math.abs(n) : n;
  }
  TB.num = num;
  function intStr(v) { /* ids like ZREP / customer_number -> canonical string */
    if (v == null || v === '') return '';
    if (typeof v === 'number') return String(Math.round(v));
    var s = String(v).trim();
    if (/^\d+(\.0+)?$/.test(s)) return String(parseInt(s, 10));
    return s;
  }
  TB.intStr = intStr;
  function toDate(v) {
    if (v == null || v === '') return null;
    if (v instanceof Date) return isNaN(v) ? null : v;
    if (typeof v === 'number') { /* excel serial */
      var d = new Date(Math.round((v - 25569) * 86400000)); return isNaN(d) ? null : new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), d.getUTCHours(), d.getUTCMinutes());
    }
    var s = String(v).trim(), m;
    if ((m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})/))) return new Date(+m[3], +m[2] - 1, +m[1]);
    var d2 = new Date(s); return isNaN(d2) ? null : d2;
  }

    var D = TB.compile(raw, Q);

  };

  };

  /* ---------- boot / login ---------- */
  async function fetchServer() {
    try { var r = await fetch(DATA_FILE + '?v=' + Date.now(), { cache: 'no-store' }); if (!r.ok) return null; var j = await r.json(); return j && j.fmt === 'TAMIMI-BDM' ? j : null; } catch (e) { return null; }
  }
  function newer(a, b) { if (!a) return b; if (!b) return a; return (a.publishedAt || '') >= (b.publishedAt || '') ? a : b; }
  TB.boot = async function () {
    TB.applyLang();
    $('#loginLang').onclick = function () { TB.toggleLang(); };
    $('#langBtn').onclick = $('#langBtn2').onclick = function () { TB.toggleLang(); };
    $('#outBtn').onclick = $('#outBtn2').onclick = function () { TB.ls.set('tbdm.k', null); TB.ss.set('tbdm.k', null); location.hash = ''; location.reload(); };
    var local = await TB.kvGet('pkg'), server = location.protocol === 'file:' ? null : await fetchServer();
    A.cands = [local, server, EMBED].filter(Boolean).sort(function (a, b) { return (b.publishedAt || '') < (a.publishedAt || '') ? -1 : 1; });
    A.pkg = A.cands[0] || null; A.pkgTime = A.pkg && A.pkg.publishedAt;
    if (A.pkg) $('#loginStamp').textContent = t('updated') + ': ' + TB.fmtDate(A.pkg.publishedAt, true);
    $('#loginForm').onsubmit = function (e) { e.preventDefault(); doLogin($('#pw').value); };
    var saved = TB.ls.get('tbdm.k') || TB.ss.get('tbdm.k');
    if (saved && A.pkg) {
      try { var o = JSON.parse(saved); TB.busy(true, t('loading')); await TB.nextFrame(); A.dataKey = await TB.importDataKey(o.k); A.role = o.r; A.wraps = A.pkg.wraps; A.wrapIndex = o.w; var inner = await TB.open(A.dataKey, A.pkg); TB.loadInner(inner); TB.busy(false); start(); return; }
      catch (e) { TB.busy(false); TB.ls.set('tbdm.k', null); TB.ss.set('tbdm.k', null); }
    }
    $('#pw').focus();
  };
  async function doLogin(pw) {
    $('#loginErr').textContent = ''; $('#loginBtn').disabled = true; TB.busy(true, t('loading')); await TB.nextFrame();
    try {
      if (A.pkg) {
        var u = null;
        for (var ci = 0; ci < A.cands.length && !u; ci++) { u = await TB.unwrap(A.cands[ci], pw); if (u) { A.pkg = A.cands[ci]; A.pkgTime = A.pkg.publishedAt; } }
        if (!u) { $('#loginErr').textContent = t('wrongPw'); return; }
        A.dataKey = u.key; A.role = u.role; A.wraps = A.pkg.wraps; A.wrapIndex = u.wrapIndex; A.pw = u.role === 'a' ? pw : null;
        var inner = await TB.open(A.dataKey, A.pkg); TB.loadInner(inner);
        var store = JSON.stringify({ k: u.keyB64, r: u.role, w: u.wrapIndex });
        if ($('#rem').checked) TB.ls.set('tbdm.k', store); else TB.ss.set('tbdm.k', store);

      } else {
        var h = VERIF.s ? await TB.pbkdfHex(pw, VERIF.s) : '';
        if (h && h === VERIF.a) { A.role = 'a'; A.pw = pw; A.dataKey = await TB.newDataKey(); A.wraps = [await TB.wrapFor(A.dataKey, pw, 'a')]; A.wrapIndex = 0; A.S = TB.defaultSettings(); A.D = null; start(); }
        else if (h && h === VERIF.b) { $('#loginErr').textContent = t('noData'); }
        else $('#loginErr').textContent = t('wrongPw');
      }
    } catch (e) { console.error(e); $('#loginErr').textContent = e.message; }

  /* ---------- upload ---------- */
  function uploadBlock() {
    return '<div class="pn"><h3>' + t('ad_upload') + '</h3><p class="hint">' + (A.D ? esc(A.D.meta.fileName || '') + ' — ' + esc(TB.fmtDate(A.D.meta.builtAt, true)) : '') + '</p>' +
      '<label class="drop" id="drop"><input type="file" id="file" accept=".xlsx,.xlsm,.xls" hidden><b>' + t('ad_drop') + '</b><span style="color:var(--steel);font-size:12.5px">.xlsx</span></label>' +
      '<div class="form-row" style="margin-top:10px"><span class="flabel">' + t('ad_mode') + ':</span><label class="chk" style="margin:0"><input type="radio" name="om" value="append" checked> ' + t('ad_append') + '</label><label class="chk" style="margin:0"><input type="radio" name="om" value="replace"> ' + t('ad_replace') + '</label></div></div>';
  }
  function wireUpload() {
    var drop = $('#drop'), file = $('#file'); if (!drop) return;
    drop.addEventListener('dragover', function (e) { e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', function () { drop.classList.remove('over'); });
    drop.addEventListener('drop', function (e) { e.preventDefault(); drop.classList.remove('over'); if (e.dataTransfer.files[0]) ingest(e.dataTransfer.files[0]); });
    file.onchange = function () { if (file.files[0]) ingest(file.files[0]); };
  }
  async function ingest(fl) {
    TB.busy(true, t('busy') + ' ' + fl.name); await TB.nextFrame();
    try {
      var buf = await fl.arrayBuffer();
      var wb = XLSX.read(buf, { type: 'array', cellDates: false });
      var sheets = {}; wb.SheetNames.forEach(function (n) { sheets[n] = XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: null }); });
      var mode = ($('input[name=om]:checked') || {}).value || 'append';
      var D = TB.buildDataset(sheets, A.D, { fileName: fl.name, ordersMode: mode });
      if (!D.stores.length && !D.sales.s.length) throw new Error('No recognised sheets in ' + fl.name);
      var first = !A.D;
      TB.setData(D);
      await TB.saveLocal();

      else TB.renderShell();

  }
